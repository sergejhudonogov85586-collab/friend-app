<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0084ff">
  <title>Друг</title>
  <style>
    :root { --bg: #f0f2f5; --card: #ffffff; --text: #1c1c1e; --sub: #6e6e73; --blue: #0084ff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }
    body { display: flex; justify-content: center; align-items: stretch; }
    #app { width: 100%; max-width: 500px; height: 100%; display: flex; flex-direction: column; background: var(--card); overflow: hidden; }
    .screen { height: 100%; display: flex; flex-direction: column; }
    #auth-screen { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; justify-content: center; }
    #auth-screen h2 { margin-bottom: 20px; text-align: center; }
    #auth-screen input { width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 16px; font-size: 16px; background: #f2f2f7; }
    #auth-screen button { background: var(--blue); color: white; border: none; border-radius: 20px; padding: 16px; font-size: 17px; font-weight: 600; width: 100%; margin-top: 8px; cursor: pointer; }
    #main-screen { display: flex; flex-direction: column; height: 100%; }
    #header { background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); padding: 16px 20px; font-size: 22px; font-weight: 700; border-bottom: 1px solid rgba(0,0,0,0.05); }
    #content { flex: 1; overflow-y: auto; padding: 20px; }
    .panel { display: none; }
    .panel.active { display: block; }
    .chat-item { padding: 14px; border-radius: 16px; background: #f2f2f7; margin-bottom: 8px; cursor: pointer; }
    .msg { margin-bottom: 16px; padding: 12px 16px; max-width: 85%; border-radius: 20px; }
    .msg.user { background: var(--blue); color: white; margin-left: auto; }
    .msg.bot { background: #f2f2f7; }
    #input-area { display: flex; padding: 16px; border-top: 1px solid rgba(0,0,0,0.05); gap: 8px; }
    #messageInput { flex: 1; padding: 14px 18px; border: 1px solid #ddd; border-radius: 24px; font-size: 16px; background: #f2f2f7; }
    #sendBtn { padding: 14px 22px; background: var(--blue); color: white; border: none; border-radius: 24px; font-size: 18px; cursor: pointer; }
    #tab-bar { display: flex; border-top: 1px solid rgba(0,0,0,0.05); }
    .tab-btn { flex: 1; text-align: center; padding: 10px; color: var(--sub); font-size: 12px; border: none; background: transparent; cursor: pointer; }
    .tab-btn.active { color: var(--blue); font-weight: 600; }
    .tab-btn span { display: block; font-size: 22px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div id="app">
  <div id="auth-screen" class="screen"><div id="auth-form"></div></div>
  <div id="main-screen" class="screen hidden">
    <div id="header">Друг</div>
    <div id="content">
      <div id="chats-panel" class="panel active">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <h3>💬 Чаты</h3>
          <button onclick="newChat()" style="background:var(--blue); color:white; border:none; border-radius:16px; padding:10px 16px; font-weight:600; cursor:pointer;">+ Новый</button>
        </div>
        <div id="chatList"></div>
      </div>
      <div id="friend-panel" class="panel">
        <div id="friendChat"></div>
        <div id="input-area">
          <input type="text" id="messageInput" placeholder="Напиши Другу...">
          <button id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
      </div>
      <div id="shop-panel" class="panel">
        <h3>🛍️ Магазин</h3>
        <p>Здесь будут темы и подписка</p>
      </div>
    </div>
    <div id="tab-bar">
      <button class="tab-btn active" data-panel="chats-panel"><span>💬</span>Чаты</button>
      <button class="tab-btn" data-panel="friend-panel"><span>👤</span>Друг</button>
      <button class="tab-btn" data-panel="shop-panel"><span>🛍️</span>Магазин</button>
    </div>
  </div>
</div>

<script>
  const AI_CHAT_URL = 'https://pvofbfvqhwkvrhnoqugc.supabase.co/functions/v1/ai-chat';
  let currentUser = null, dialogHistory = [];

  // Запуск при загрузке
  window.onload = () => {
    const savedPhone = localStorage.getItem('friendPhone');
    if (savedPhone) {
      // Уже зарегистрирован — показываем форму входа
      showLoginForm(savedPhone);
    } else {
      showRegistrationForm();
    }
    // Настройка таб-бара
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const panelId = btn.dataset.panel;
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById(panelId).classList.add('active');
        // Показываем поле ввода только на вкладке "Друг"
        document.getElementById('input-area').style.display = (panelId === 'friend-panel') ? 'flex' : 'none';
      });
    });
  };

  // ФОРМЫ РЕГИСТРАЦИИ И ВХОДА
  function showRegistrationForm() {
    const authForm = document.getElementById('auth-form');
    authForm.innerHTML = `
      <h2>✨ Регистрация</h2>
      <input id="regPhone" type="tel" placeholder="Номер телефона (+7...)" value="">
      <div id="codeSectionReg" style="display:none;">
        <input id="regCode" type="text" placeholder="Код из СМС">
        <button onclick="verifyCode('reg')">Подтвердить</button>
      </div>
      <button id="sendCodeBtn" onclick="sendCode('reg')">Получить код</button>
      <p style="text-align:center; margin-top:16px;">Уже есть аккаунт? <a href="#" onclick="showLoginForm(); return false;">Войти</a></p>
    `;
    document.getElementById('auth-screen').classList.remove('hidden');
    document.getElementById('main-screen').classList.add('hidden');
  }

  function showLoginForm(phone = '') {
    const authForm = document.getElementById('auth-form');
    authForm.innerHTML = `
      <h2>🔐 Вход</h2>
      <input id="loginPhone" type="tel" placeholder="Номер телефона" value="${phone}">
      <div id="codeSectionLogin" style="display:none;">
        <input id="loginCode" type="text" placeholder="Код из СМС">
        <button onclick="verifyCode('login')">Подтвердить</button>
      </div>
      <button id="sendLoginCodeBtn" onclick="sendCode('login')">Получить код</button>
      <p style="text-align:center; margin-top:16px;">Нет аккаунта? <a href="#" onclick="showRegistrationForm(); return false;">Зарегистрироваться</a></p>
    `;
    document.getElementById('auth-screen').classList.remove('hidden');
    document.getElementById('main-screen').classList.add('hidden');
  }

  // Имитация отправки СМС
  function sendCode(type) {
    if (type === 'reg') {
      const phone = document.getElementById('regPhone').value.trim();
      if (!phone) { alert('Введите номер телефона'); return; }
      document.getElementById('codeSectionReg').style.display = 'block';
      document.getElementById('sendCodeBtn').style.display = 'none';
      alert('Код отправлен (заглушка: 1234)');
    } else {
      const phone = document.getElementById('loginPhone').value.trim();
      if (!phone) { alert('Введите номер телефона'); return; }
      document.getElementById('codeSectionLogin').style.display = 'block';
      document.getElementById('sendLoginCodeBtn').style.display = 'none';
      alert('Код отправлен (заглушка: 1234)');
    }
  }

  // Проверка кода
  function verifyCode(type) {
    const code = type === 'reg' ? document.getElementById('regCode').value.trim() : document.getElementById('loginCode').value.trim();
    const phone = type === 'reg' ? document.getElementById('regPhone').value.trim() : document.getElementById('loginPhone').value.trim();
    
    if (code !== '1234') { alert('Неверный код'); return; }
    
    // Сохраняем телефон и авторизуем пользователя
    localStorage.setItem('friendPhone', phone);
    currentUser = { phone: phone, name: 'Друг' };
    
    // Показываем главный экран
    document.getElementById('auth-screen').classList.add('hidden');
    document.getElementById('main-screen').classList.remove('hidden');
    
    // Загружаем список чатов
    const chatList = document.getElementById('chatList');
    chatList.innerHTML = '<div class="chat-item" onclick="openFriendChat()">🤖 Друг</div>';
  }

  // Навигация
  function openFriendChat() {
    document.querySelector('.tab-btn[data-panel="friend-panel"]').click();
  }

  function newChat() {
    const phone = prompt('Введите номер телефона:');
    if (phone) {
      const chatList = document.getElementById('chatList');
      chatList.innerHTML += `<div class="chat-item" onclick="alert('Чат с ${phone}')">📞 ${phone}</div>`;
    }
  }

  // AI-чат
  function addMessage(type, text) {
    const chat = document.getElementById('friendChat');
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function sendMessage() {
    if (!currentUser) return;
    const input = document.getElementById('messageInput');
    const msg = input.value.trim();
    if (!msg) return;
    
    addMessage('user', msg);
    dialogHistory.push({ role: 'user', text: msg });
    input.value = '';
    
    const typingMsg = addMessage('bot', '...');
    
    try {
      const res = await fetch(AI_CHAT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: msg,
          friendName: currentUser.name,
          character: '',
          allowMature: true,
          history: dialogHistory.slice(-30),
          email: currentUser.phone
        })
      });
      const data = await res.json();
      typingMsg.textContent = data.reply || 'Прости, я задумался...';
      dialogHistory.push({ role: 'assistant', text: data.reply });
    } catch (e) {
      typingMsg.textContent = 'Ошибка соединения';
    }
  }
</script>
</body>
</html>
