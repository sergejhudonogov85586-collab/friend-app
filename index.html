<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0084ff">
  <title>Друг</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f0f2f5; }
    body { display:flex; justify-content:center; align-items:stretch; }
    #app { width:100%; max-width:500px; height:100%; display:flex; flex-direction:column; background:white; }
    .screen { height:100%; display:flex; flex-direction:column; }
    #auth-screen { padding:20px; background:white; }
    #auth-screen input { width:100%; padding:12px; margin-bottom:10px; border:1px solid #ddd; border-radius:12px; font-size:16px; }
    #auth-screen button { background:#0084ff; color:white; border:none; border-radius:25px; padding:14px; font-size:16px; width:100%; margin-top:10px; cursor:pointer; }
    .avatar-grid { display:flex; flex-wrap:wrap; gap:12px; margin:12px 0; }
    .avatar-option { width:60px; height:60px; border-radius:30px; background:#f0f0f0; display:flex; align-items:center; justify-content:center; font-size:30px; border:3px solid transparent; cursor:pointer; }
    .avatar-option.selected { border-color:#0084ff; background:#e0edff; }
    .mature-row { display:flex; align-items:center; margin:16px 0; height:24px; }
    .mature-row input[type="checkbox"] { margin:0 8px 0 0; width:20px; height:20px; }
    #main-screen { background:white; }
    #header { background:#0084ff; color:white; padding:12px 16px; display:flex; align-items:center; gap:10px; font-size:20px; font-weight:600; }
    #header-avatar { font-size:32px; }
    #content { flex:1; overflow-y:auto; padding:16px; }
    .panel { display:none; }
    .panel.active { display:block; }
    .msg { margin-bottom:12px; padding:10px 14px; border-radius:20px; max-width:80%; display:flex; align-items:flex-end; gap:8px; }
    .msg.user { background:#0084ff; color:white; margin-left:auto; flex-direction:row-reverse; }
    .msg.bot { background:#f0f0f0; }
    .avatar-icon { font-size:28px; width:36px; height:36px; border-radius:18px; background:#e0e0e0; display:flex; align-items:center; justify-content:center; }
    #input-area { display:flex; padding:10px; border-top:1px solid #eee; gap:8px; background:white; padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px)); }
    #messageInput { flex:1; padding:12px 16px; border:1px solid #ddd; border-radius:25px; font-size:16px; }
    #sendBtn { padding:12px 20px; background:#0084ff; color:white; border:none; border-radius:25px; font-size:20px; cursor:pointer; }
    #tab-bar { display:flex; border-top:1px solid #eee; background:white; padding-bottom:env(safe-area-inset-bottom, 0px); }
    .tab-btn { flex:1; text-align:center; padding:8px; color:#888; font-size:12px; border:none; background:transparent; cursor:pointer; }
    .tab-btn.active { color:#0084ff; }
    .tab-btn span { display:block; font-size:20px; }
    .shop-item { background:white; padding:15px; margin-bottom:12px; border-radius:16px; box-shadow:0 2px 8px rgba(0,0,0,0.05); display:flex; justify-content:space-between; align-items:center; }
    .buy-btn { background:#0084ff; color:white; border:none; border-radius:20px; padding:8px 16px; cursor:pointer; }
    .hidden { display:none; }
  </style>
</head>
<body>
<div id="app">
  <div id="auth-screen" class="screen">
    <div id="auth-form"></div>
  </div>
  <div id="main-screen" class="screen hidden">
    <div id="header">
      <span id="header-avatar">😺</span>
      <span id="header-name">Друг</span>
    </div>
    <div id="content">
      <div id="chat-panel" class="panel active"></div>
      <div id="tasks-panel" class="panel">
        <h3>📝 Мои задачи</h3>
        <div id="tasksList">Пока нет задач</div>
        <button class="buy-btn" onclick="addTaskManually()" style="margin-top:10px; width:100%;">+ Добавить задачу</button>
      </div>
      <div id="games-panel" class="panel">
        <h3>🎮 Игры</h3>
        <div class="game-container">
          <h4>Угадай число</h4>
          <p id="gameMessage">Я загадал число от 1 до 100.</p>
          <input type="number" id="guessInput" placeholder="Твой вариант">
          <button class="buy-btn" onclick="checkGuess()">Проверить</button>
        </div>
      </div>
      <div id="shop-panel" class="panel">
        <h3>🛍️ Магазин</h3>
        <div class="shop-item premium-card" style="background: linear-gradient(135deg, #0084ff, #00c6ff); color: white;">
          <div><strong>Друг Premium</strong><br><small>Все функции, безлимит, темы</small></div>
          <button class="buy-btn" style="background: white; color: #0084ff;" onclick="alert('Подписка 399₽/мес (прототип)')">399₽/мес</button>
        </div>
        <div class="shop-item">
          <div><strong>Тема чата: Космос</strong></div>
          <button class="buy-btn" onclick="alert('Куплено!')">99₽</button>
        </div>
        <div class="shop-item">
          <div><strong>Аватар: Феникс</strong></div>
          <button class="buy-btn" onclick="alert('Куплено!')">149₽</button>
        </div>
      </div>
    </div>
    <div id="input-area">
      <input type="text" id="messageInput" placeholder="Напиши Другу...">
      <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
    <div id="tab-bar">
      <button class="tab-btn active" data-panel="chat-panel"><span>💬</span>Чат</button>
      <button class="tab-btn" data-panel="tasks-panel"><span>📋</span>Задачи</button>
      <button class="tab-btn" data-panel="games-panel"><span>🎮</span>Игры</button>
      <button class="tab-btn" data-panel="shop-panel"><span>🛍️</span>Магазин</button>
    </div>
  </div>
</div>

<script>
  // Supabase настройки (уже с твоими ключами)
  const SUPABASE_URL = 'https://pvofbfvqhwkvrhnoqugc.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Ei3qoPtQnf3eH3aKf93h8w_F902ErzV';

  const AVATARS = [
    { id: 'cat', neutral: '😺', happy: '😸', thinking: '😼' },
    { id: 'dog', neutral: '🐶', happy: '🐶😄', thinking: '🐶🤔' },
    { id: 'fox', neutral: '🦊', happy: '🦊😊', thinking: '🦊🧐' },
    { id: 'robot', neutral: '🤖', happy: '🤖✨', thinking: '🤖💭' },
    { id: 'alien', neutral: '👽', happy: '👽😄', thinking: '👽❓' },
    { id: 'dragon', neutral: '🐲', happy: '🐲🔥', thinking: '🐲💨' }
  ];

  let currentUser = null;
  let dialogHistory = [];
  let secretNumber = Math.floor(Math.random() * 100) + 1;

  const authScreen = document.getElementById('auth-screen');
  const mainScreen = document.getElementById('main-screen');
  const authForm = document.getElementById('auth-form');

  window.onload = () => {
    const savedEmail = localStorage.getItem('friendEmail');
    if (savedEmail) {
      showLoginForm(savedEmail);
    } else {
      showRegistrationForm();
    }
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const panelId = btn.dataset.panel;
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById(panelId).classList.add('active');
        document.getElementById('input-area').style.display = (panelId === 'chat-panel') ? 'flex' : 'none';
      });
    });
  };

  function showRegistrationForm() {
    authForm.innerHTML = '<h2>✨ Регистрация</h2>' +
      '<input id="regEmail" placeholder="Email">' +
      '<input id="regPassword" type="password" placeholder="Пароль">' +
      '<input id="regName" placeholder="Имя друга">' +
      '<textarea id="characterInput" rows="2" placeholder="Характер (дерзкий, мудрый...)" style="width:100%; margin-bottom:12px; border-radius:12px; border:1px solid #ddd; padding:12px;"></textarea>' +
      '<input type="date" id="birthdateInput">' +
      '<div class="avatar-grid" id="avatarGrid"></div>' +
      '<div class="mature-row"><input type="checkbox" id="matureCheckbox" disabled><label for="matureCheckbox">Разрешить нецензурную лексику</label></div>' +
      '<button onclick="register()">Зарегистрироваться</button>' +
      '<p style="text-align:center;">Уже есть аккаунт? <a href="#" onclick="showLoginForm();return false;">Войти</a></p>';
    buildAvatarGrid('cat');
    document.getElementById('birthdateInput').addEventListener('input', updateMatureCheckbox);
    authScreen.classList.remove('hidden');
    mainScreen.classList.add('hidden');
  }

  function showLoginForm(email = '') {
    authForm.innerHTML = '<h2>🔐 Вход</h2>' +
      '<input id="loginEmail" placeholder="Email" value="' + (email || '') + '">' +
      '<input id="loginPassword" type="password" placeholder="Пароль">' +
      '<button onclick="login()">Войти</button>' +
      '<p style="text-align:center;">Нет аккаунта? <a href="#" onclick="showRegistrationForm();return false;">Регистрация</a></p>';
    authScreen.classList.remove('hidden');
    mainScreen.classList.add('hidden');
  }

  function buildAvatarGrid(selectedId) {
    const grid = document.getElementById('avatarGrid');
    if (!grid) return;
    grid.innerHTML = '';
    AVATARS.forEach(a => {
      const div = document.createElement('div');
      div.className = 'avatar-option' + (a.id === selectedId ? ' selected' : '');
      div.textContent = a.neutral;
      div.onclick = () => {
        grid.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
        div.classList.add('selected');
      };
      grid.appendChild(div);
    });
  }

  function updateMatureCheckbox() {
    const bdate = document.getElementById('birthdateInput').value;
    const cb = document.getElementById('matureCheckbox');
    if (!bdate) { cb.disabled = true; cb.checked = false; return; }
    const age = Math.floor((new Date() - new Date(bdate)) / 31557600000);
    cb.disabled = age < 18;
    if (age < 18) cb.checked = false;
  }

  function showMain() {
    authScreen.classList.add('hidden');
    mainScreen.classList.remove('hidden');
    document.getElementById('header-avatar').textContent = getAvatarEmotion(currentUser.avatar, 'neutral');
    document.getElementById('header-name').textContent = currentUser.name;
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('chat-panel').classList.add('active');
    document.getElementById('input-area').style.display = 'flex';
  }

  function getAvatarEmotion(id, emotion) {
    const av = AVATARS.find(a => a.id === id);
    return av ? (av[emotion] || av.neutral) : '😺';
  }

  function addMessage(type, text, avatarId, emotion = 'neutral') {
    const chat = document.getElementById('chat-panel');
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    if (type === 'bot') {
      const icon = document.createElement('span');
      icon.className = 'avatar-icon';
      icon.textContent = getAvatarEmotion(avatarId || currentUser.avatar, emotion);
      div.appendChild(icon);
      const span = document.createElement('span');
      span.textContent = text;
      div.appendChild(span);
    } else {
      div.textContent = text;
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function register() {
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const name = document.getElementById('regName').value.trim() || 'Друг';
    const character = document.getElementById('characterInput').value.trim() || '';
    const birthdate = document.getElementById('birthdateInput').value;
    const mature = document.getElementById('matureCheckbox');
    const matureAllowed = !mature.disabled && mature.checked;
    const selectedAvatar = document.querySelector('.avatar-option.selected')?.dataset.id || 'cat';
    if (!email || !password) { alert('Введите email и пароль'); return; }

    try {
      const checkRes = await fetch(`${SUPABASE_URL}/rest/v1/users?select=*&email=eq.${encodeURIComponent(email)}`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      });
      const existing = await checkRes.json();
      if (existing && existing.length > 0) {
        alert('Пользователь уже существует');
        return;
      }

      const res = await fetch(`${SUPABASE_URL}/rest/v1/users`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify({ email, password, name, character, birthdate, avatar: selectedAvatar, memory: '' })
      });
      const data = await res.json();
      if (data && data.length > 0) {
        localStorage.setItem('friendEmail', email);
        currentUser = { email, name, character, birthdate, avatar: selectedAvatar, matureAllowed };
        showMain();
        addMessage('bot', 'Привет, я ' + name + '!', selectedAvatar);
      } else {
        alert('Ошибка регистрации: ' + JSON.stringify(data));
      }
    } catch (e) {
      alert('Сетевая ошибка: ' + e.message);
    }
  }

  async function login() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) { alert('Введите email и пароль'); return; }

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/users?select=*&email=eq.${encodeURIComponent(email)}&password=eq.${encodeURIComponent(password)}`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      });
      const data = await res.json();
      if (data && data.length > 0) {
        const user = data[0];
        localStorage.setItem('friendEmail', email);
        currentUser = {
          email: user.email,
          name: user.name,
          character: user.character,
          birthdate: user.birthdate,
          avatar: user.avatar,
          matureAllowed: (new Date().getFullYear() - new Date(user.birthdate).getFullYear()) >= 18
        };
        showMain();
        addMessage('bot', 'С возвращением, ' + currentUser.name + '!', currentUser.avatar);
      } else {
        alert('Неверный email или пароль');
      }
    } catch (e) {
      alert('Сетевая ошибка: ' + e.message);
    }
  }

  // Временный чат-заглушка (пока не подключим AI)
  function sendMessage() {
    if (!currentUser) return;
    const input = document.getElementById('messageInput');
    const msg = input.value.trim();
    if (!msg) return;
    addMessage('user', msg);
    input.value = '';
    setTimeout(() => {
      addMessage('bot', 'Вы написали: «' + msg + '». Чат скоро заработает!', currentUser.avatar, 'happy');
    }, 500);
  }

  function checkGuess() {
    const guess = parseInt(document.getElementById('guessInput').value);
    const msg = document.getElementById('gameMessage');
    if (guess === secretNumber) {
      msg.textContent = 'Поздравляю! Ты угадал! Загадано новое число.';
      secretNumber = Math.floor(Math.random() * 100) + 1;
    } else if (guess > secretNumber) {
      msg.textContent = 'Меньше!';
    } else {
      msg.textContent = 'Больше!';
    }
  }

  function addTaskManually() {
    const task = prompt('Введите задачу:');
    if (task) {
      const list = document.getElementById('tasksList');
      if (list.textContent === 'Пока нет задач') list.innerHTML = '';
      const div = document.createElement('div');
      div.className = 'task-item';
      div.textContent = task;
      list.appendChild(div);
    }
  }
</script>
</body>
</html>
