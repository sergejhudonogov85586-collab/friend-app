<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0084ff">
  <title>Друг</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f0f2f5; }
    body { display:flex; justify-content:center; align-items:stretch; }
    #app { width:100%; max-width:500px; height:100%; display:flex; flex-direction:column; background:white; }
    .screen { height:100%; display:flex; flex-direction:column; }
    #auth-screen { padding:20px; background:white; }
    #auth-screen input { width:100%; padding:12px; margin-bottom:10px; border:1px solid #ddd; border-radius:12px; font-size:16px; }
    #auth-screen button { background:#0084ff; color:white; border:none; border-radius:25px; padding:14px; font-size:16px; width:100%; margin-top:10px; cursor:pointer; }
    .avatar-grid { display:flex; flex-wrap:wrap; gap:12px; margin:12px 0; }
    .avatar-option { width:60px; height:60px; border-radius:30px; background:#f0f0f0; display:flex; align-items:center; justify-content:center; font-size:30px; border:3px solid transparent; cursor:pointer; }
    .avatar-option.selected { border-color:#0084ff; background:#e0edff; }
    .mature-row { display:flex; align-items:center; margin:16px 0; gap:8px; }
    .mature-row input[type="checkbox"] { width:20px; height:20px; margin:0; }
    .mature-row label { margin:0; font-size:14px; }
    #main-screen { background:white; }
    #header { background:#0084ff; color:white; padding:12px 16px; display:flex; align-items:center; gap:10px; font-size:20px; font-weight:600; }
    #header-avatar { width:40px; height:40px; }
    #content { flex:1; overflow-y:auto; padding:16px; }
    .panel { display:none; }
    .panel.active { display:block; }
    .msg { margin-bottom:12px; padding:10px 14px; border-radius:20px; max-width:80%; display:flex; align-items:flex-end; gap:8px; }
    .msg.user { background:#0084ff; color:white; margin-left:auto; flex-direction:row-reverse; }
    .msg.bot { background:#f0f0f0; }
    .avatar-icon { width:36px; height:36px; border-radius:18px; background:#e0e0e0; display:flex; align-items:center; justify-content:center; }
    #input-area { display:flex; padding:10px; border-top:1px solid #eee; gap:8px; background:white; padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px)); }
    #messageInput { flex:1; padding:12px 16px; border:1px solid #ddd; border-radius:25px; font-size:16px; }
    #sendBtn { padding:12px 20px; background:#0084ff; color:white; border:none; border-radius:25px; font-size:20px; cursor:pointer; }
    #tab-bar { display:flex; border-top:1px solid #eee; background:white; padding-bottom:env(safe-area-inset-bottom, 0px); }
    .tab-btn { flex:1; text-align:center; padding:8px; color:#888; font-size:12px; border:none; background:transparent; cursor:pointer; }
    .tab-btn.active { color:#0084ff; }
    .tab-btn span { display:block; font-size:20px; }
    .shop-item { background:white; padding:15px; margin-bottom:12px; border-radius:16px; box-shadow:0 2px 8px rgba(0,0,0,0.05); display:flex; justify-content:space-between; align-items:center; }
    .buy-btn { background:#0084ff; color:white; border:none; border-radius:20px; padding:8px 16px; cursor:pointer; }
    .hidden { display:none; }
    /* Тёмная тема */
    body.dark { background:#1e1e1e; }
    body.dark #app { background:#2d2d2d; color:#eee; }
    body.dark #auth-screen { background:#2d2d2d; }
    body.dark #main-screen { background:#2d2d2d; }
    body.dark #header { background:#1a1a1a; }
    body.dark #input-area { background:#2d2d2d; border-color:#444; }
    body.dark #messageInput { background:#3a3a3a; border-color:#555; color:#eee; }
    body.dark #tab-bar { background:#2d2d2d; border-color:#444; }
    body.dark .msg.bot { background:#3a3a3a; }
    body.dark .tab-btn { color:#aaa; }
    body.dark .tab-btn.active { color:#0084ff; }
    /* Модальное окно календаря */
    #calendarModal { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; z-index:1000; }
    #calendarModal.active { display:flex; }
    #calendarBox { background:white; border-radius:16px; padding:20px; width:90%; max-width:350px; }
    body.dark #calendarBox { background:#2d2d2d; }
    #calendarGrid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
    #calendarGrid div { padding:8px; text-align:center; border-radius:8px; cursor:pointer; }
    #calendarGrid .holiday { color:red; }
    #calendarGrid .today { background:#0084ff; color:white; }
    /* 2D аватар */
    #avatar2d { width:40px; height:40px; }
    .eye { animation: blink 3s infinite; }
    @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
  </style>
</head>
<body>
<div id="app">
  <div id="auth-screen" class="screen">
    <div id="auth-form"></div>
  </div>
  <div id="main-screen" class="screen hidden">
    <div id="header">
      <svg id="avatar2d" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="45" fill="#FFD93D"/>
        <circle cx="35" cy="40" r="5" fill="#333" class="eye"/>
        <circle cx="65" cy="40" r="5" fill="#333" class="eye"/>
        <path d="M 35 60 Q 50 70 65 60" stroke="#333" stroke-width="3" fill="none"/>
      </svg>
      <span id="header-name">Друг</span>
      <button onclick="toggleTheme()" style="margin-left:auto; background:none; border:none; color:white; font-size:20px;">🌓</button>
    </div>
    <div id="content">
      <div id="chat-panel" class="panel active"></div>
      <div id="tasks-panel" class="panel">
        <h3>📝 Ежедневник</h3>
        <button class="buy-btn" onclick="openCalendar()" style="margin-bottom:10px;">📅 Выбрать дату</button>
        <div id="tasksList">Пока нет задач</div>
        <button class="buy-btn" onclick="addTaskManually()" style="margin-top:10px; width:100%;">+ Добавить задачу</button>
      </div>
      <div id="games-panel" class="panel">
        <h3>🎮 Игры</h3>
        <div class="game-container">
          <h4>Угадай число</h4>
          <p id="gameMessage">Я загадал число от 1 до 100.</p>
          <input type="number" id="guessInput" placeholder="Твой вариант">
          <button class="buy-btn" onclick="checkGuess()">Проверить</button>
        </div>
        <div class="game-container" style="margin-top:20px;">
          <h4>Крестики-нолики</h4>
          <div id="tic-tac-toe"></div>
          <p id="tttMessage"></p>
          <button class="buy-btn" onclick="resetTicTacToe()">Новая игра</button>
        </div>
      </div>
      <div id="shop-panel" class="panel">
        <h3>🛍️ Магазин</h3>
        <div class="shop-item premium-card" style="background: linear-gradient(135deg, #0084ff, #00c6ff); color: white;">
          <div><strong>Друг Premium</strong><br><small>Все функции, безлимит, темы</small></div>
          <button class="buy-btn" style="background: white; color: #0084ff;" onclick="alert('Подписка 399₽/мес (прототип)')">399₽/мес</button>
        </div>
        <div class="shop-item">
          <div><strong>Тема чата: Космос</strong></div>
          <button class="buy-btn" onclick="alert('Куплено!')">99₽</button>
        </div>
        <div class="shop-item">
          <div><strong>Аватар: Феникс</strong></div>
          <button class="buy-btn" onclick="alert('Куплено!')">149₽</button>
        </div>
      </div>
    </div>
    <div id="input-area">
      <input type="text" id="messageInput" placeholder="Напиши Другу...">
      <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
    <div id="tab-bar">
      <button class="tab-btn active" data-panel="chat-panel"><span>💬</span>Чат</button>
      <button class="tab-btn" data-panel="tasks-panel"><span>📋</span>Ежедневник</button>
      <button class="tab-btn" data-panel="games-panel"><span>🎮</span>Игры</button>
      <button class="tab-btn" data-panel="shop-panel"><span>🛍️</span>Магазин</button>
    </div>
  </div>
</div>

<div id="calendarModal">
  <div id="calendarBox">
    <h3>Выберите дату</h3>
    <div id="calendarGrid"></div>
    <button class="buy-btn" onclick="closeCalendar()" style="margin-top:10px; width:100%;">Закрыть</button>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://pvofbfvqhwkvrhnoqugc.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Ei3qoPtQnf3eH3aKf93h8w_F902ErzV';
  const AI_CHAT_URL = 'https://pvofbfvqhwkvrhnoqugc.supabase.co/functions/v1/ai-chat';

  let currentUser = null;
  let dialogHistory = [];
  let secretNumber = Math.floor(Math.random() * 100) + 1;
  let tttBoard = ['', '', '', '', '', '', '', '', ''];
  let tttTurn = 'X';

  const authScreen = document.getElementById('auth-screen');
  const mainScreen = document.getElementById('main-screen');
  const authForm = document.getElementById('auth-form');

  window.onload = () => {
    const savedEmail = localStorage.getItem('friendEmail');
    if (savedEmail) { showLoginForm(savedEmail); }
    else { showRegistrationForm(); }
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const panelId = btn.dataset.panel;
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById(panelId).classList.add('active');
        document.getElementById('input-area').style.display = (panelId === 'chat-panel') ? 'flex' : 'none';
        if (panelId === 'tasks-panel') loadTasks();
        if (panelId === 'games-panel') renderTicTacToe();
      });
    });
  };

  function toggleTheme() {
    document.body.classList.toggle('dark');
    localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
  }
  if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');

  // Календарь
  function openCalendar() { document.getElementById('calendarModal').classList.add('active'); renderCalendarGrid(); }
  function closeCalendar() { document.getElementById('calendarModal').classList.remove('active'); }
  function renderCalendarGrid() {
    const grid = document.getElementById('calendarGrid');
    const today = new Date();
    const year = today.getFullYear(), month = today.getMonth();
    const firstDay = new Date(year, month, 1).getDay() || 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const holidays = { '1': 'Новый год', '7': 'Рождество', '23': 'День защитника', '8': '8 Марта', '1.5': 'Праздник Весны', '9': 'День Победы', '12': 'День России', '4': 'День народного единства' };
    let html = '<div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>';
    for (let i = 1; i < firstDay; i++) html += '<div></div>';
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = d + '.' + (month + 1);
      const isHoliday = holidays[dateStr] || holidays[d.toString()];
      const cls = (d === today.getDate()) ? 'today' : '';
      const holidayCls = isHoliday ? 'holiday' : '';
      html += `<div class="${cls} ${holidayCls}" onclick="selectDate(${d})">${d}${isHoliday ? '<br><small>'+isHoliday+'</small>' : ''}</div>`;
    }
    grid.innerHTML = html;
  }
  function selectDate(day) {
    const today = new Date();
    const selected = new Date(today.getFullYear(), today.getMonth(), day);
    alert('Выбрана дата: ' + selected.toLocaleDateString());
    closeCalendar();
  }

  // Задачи с сохранением в Supabase
  async function loadTasks() {
    if (!currentUser) return;
    const res = await fetch(`${SUPABASE_URL}/rest/v1/tasks?select=*&email=eq.${encodeURIComponent(currentUser.email)}`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    const tasks = await res.json();
    const list = document.getElementById('tasksList');
    list.innerHTML = tasks.length ? '' : 'Пока нет задач';
    tasks.forEach(t => {
      const div = document.createElement('div');
      div.className = 'task-item';
      div.textContent = t.task;
      list.appendChild(div);
    });
  }
  async function addTaskManually() {
    const task = prompt('Введите задачу:');
    if (!task || !currentUser) return;
    await fetch(`${SUPABASE_URL}/rest/v1/tasks`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
      body: JSON.stringify({ email: currentUser.email, task, date: new Date().toISOString() })
    });
    loadTasks();
  }

  // Регистрация / вход (без изменений)
  function showRegistrationForm() {
    authForm.innerHTML = '<h2>✨ Регистрация</h2>' +
      '<input id="regEmail" placeholder="Email">' +
      '<input id="regPassword" type="password" placeholder="Пароль">' +
      '<input id="regName" placeholder="Имя друга">' +
      '<textarea id="characterInput" rows="2" placeholder="Характер (дерзкий, мудрый...)" style="width:100%; margin-bottom:12px; border-radius:12px; border:1px solid #ddd; padding:12px;"></textarea>' +
      '<input type="date" id="birthdateInput">' +
      '<div class="avatar-grid" id="avatarGrid"></div>' +
      '<div class="mature-row"><input type="checkbox" id="matureCheckbox" disabled><label for="matureCheckbox">Разрешить нецензурную лексику</label></div>' +
      '<button onclick="register()">Зарегистрироваться</button>' +
      '<p style="text-align:center;">Уже есть аккаунт? <a href="#" onclick="showLoginForm();return false;">Войти</a></p>';
    buildAvatarGrid('cat');
    document.getElementById('birthdateInput').addEventListener('input', updateMatureCheckbox);
    authScreen.classList.remove('hidden');
    mainScreen.classList.add('hidden');
  }
  function showLoginForm(email = '') {
    authForm.innerHTML = '<h2>🔐 Вход</h2>' +
      '<input id="loginEmail" placeholder="Email" value="' + (email || '') + '">' +
      '<input id="loginPassword" type="password" placeholder="Пароль">' +
      '<button onclick="login()">Войти</button>' +
      '<p style="text-align:center;">Нет аккаунта? <a href="#" onclick="showRegistrationForm();return false;">Регистрация</a></p>';
    authScreen.classList.remove('hidden');
    mainScreen.classList.add('hidden');
  }
  function buildAvatarGrid(selectedId) {
    const grid = document.getElementById('avatarGrid');
    if (!grid) return;
    grid.innerHTML = '';
    AVATARS.forEach(a => {
      const div = document.createElement('div');
      div.className = 'avatar-option' + (a.id === selectedId ? ' selected' : '');
      div.textContent = a.neutral;
      div.onclick = () => { grid.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected')); div.classList.add('selected'); };
      grid.appendChild(div);
    });
  }
  function updateMatureCheckbox() {
    const bdate = document.getElementById('birthdateInput').value;
    const cb = document.getElementById('matureCheckbox');
    if (!bdate) { cb.disabled = true; cb.checked = false; return; }
    const age = Math.floor((new Date() - new Date(bdate)) / 31557600000);
    cb.disabled = age < 18;
    if (age < 18) cb.checked = false;
  }
  function showMain() {
    authScreen.classList.add('hidden');
    mainScreen.classList.remove('hidden');
    document.getElementById('header-avatar').textContent = getAvatarEmotion(currentUser.avatar, 'neutral');
    document.getElementById('header-name').textContent = currentUser.name;
  }
  function getAvatarEmotion(id, emotion) {
    const av = AVATARS.find(a => a.id === id);
    return av ? (av[emotion] || av.neutral) : '😺';
  }
  function addMessage(type, text, avatarId, emotion = 'neutral') {
    const chat = document.getElementById('chat-panel');
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    if (type === 'bot') {
      const icon = document.createElement('span');
      icon.className = 'avatar-icon';
      icon.textContent = getAvatarEmotion(avatarId || currentUser.avatar, emotion);
      div.appendChild(icon);
      const span = document.createElement('span');
      span.textContent = text;
      div.appendChild(span);
    } else { div.textContent = text; }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }
  async function register() {
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const name = document.getElementById('regName').value.trim() || 'Друг';
    const character = document.getElementById('characterInput').value.trim() || '';
    const birthdate = document.getElementById('birthdateInput').value;
    const mature = document.getElementById('matureCheckbox');
    const matureAllowed = !mature.disabled && mature.checked;
    const selectedAvatar = document.querySelector('.avatar-option.selected')?.dataset.id || 'cat';
    if (!email || !password) { alert('Введите email и пароль'); return; }
    try {
      const checkRes = await fetch(`${SUPABASE_URL}/rest/v1/users?select=*&email=eq.${encodeURIComponent(email)}`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      });
      const existing = await checkRes.json();
      if (existing && existing.length > 0) { alert('Пользователь уже существует'); return; }
      const res = await fetch(`${SUPABASE_URL}/rest/v1/users`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
        body: JSON.stringify({ email, password, name, character, birthdate, avatar: selectedAvatar, memory: '' })
      });
      const data = await res.json();
      if (data && data.length > 0) {
        localStorage.setItem('friendEmail', email);
        currentUser = { email, name, character, birthdate, avatar: selectedAvatar, matureAllowed };
        showMain();
        addMessage('bot', 'Привет, я ' + name + '!', selectedAvatar);
      } else { alert('Ошибка регистрации: ' + JSON.stringify(data)); }
    } catch (e) { alert('Сетевая ошибка: ' + e.message); }
  }
  async function login() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) { alert('Введите email и пароль'); return; }
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/users?select=*&email=eq.${encodeURIComponent(email)}&password=eq.${encodeURIComponent(password)}`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      });
      const data = await res.json();
      if (data && data.length > 0) {
        const user = data[0];
        localStorage.setItem('friendEmail', email);
        currentUser = { email: user.email, name: user.name, character: user.character, birthdate: user.birthdate, avatar: user.avatar, matureAllowed: (new Date().getFullYear() - new Date(user.birthdate).getFullYear()) >= 18 };
        showMain();
        addMessage('bot', 'С возвращением, ' + currentUser.name + '!', currentUser.avatar);
      } else { alert('Неверный email или пароль'); }
    } catch (e) { alert('Сетевая ошибка: ' + e.message); }
  }

  // Чат
  async function sendMessage() {
    if (!currentUser) return;
    const input = document.getElementById('messageInput');
    const msg = input.value.trim();
    if (!msg) return;
    addMessage('user', msg);
    dialogHistory.push({ role: 'user', text: msg });
    input.value = '';
    const typingMsg = addMessage('bot', 'Друг печатает...', currentUser.avatar, 'thinking');
    try {
      const res = await fetch(AI_CHAT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: msg,
          friendName: currentUser.name,
          character: currentUser.character,
          allowMature: currentUser.matureAllowed,
          history: dialogHistory.slice(-30),
          email: currentUser.email
        })
      });
      const data = await res.json();
      const reply = data.reply || 'Прости, я задумался...';
      typingMsg.querySelector('span:last-child').textContent = reply;
      const av = typingMsg.querySelector('.avatar-icon');
      if (av) {
        let emotion = 'neutral';
        if (reply.match(/[😄😂🤣😊😁]/)) emotion = 'happy';
        else if (reply.match(/[🤔❓💭]/)) emotion = 'thinking';
        av.textContent = getAvatarEmotion(currentUser.avatar, emotion);
      }
      dialogHistory.push({ role: 'assistant', text: reply });
    } catch (e) { typingMsg.querySelector('span:last-child').textContent = 'Ошибка соединения'; }
  }

  // Игры (без изменений)
  function checkGuess() {
    const guess = parseInt(document.getElementById('guessInput').value);
    const msg = document.getElementById('gameMessage');
    if (guess === secretNumber) { msg.textContent = 'Поздравляю! Ты угадал! Загадано новое число.'; secretNumber = Math.floor(Math.random() * 100) + 1; }
    else if (guess > secretNumber) { msg.textContent = 'Меньше!'; }
    else { msg.textContent = 'Больше!'; }
  }
  function renderTicTacToe() {
    const board = document.getElementById('tic-tac-toe');
    board.innerHTML = '';
    tttBoard.forEach((cell, i) => {
      const div = document.createElement('div');
      div.textContent = cell;
      div.onclick = () => tttMove(i);
      board.appendChild(div);
    });
  }
  function tttMove(i) {
    if (tttBoard[i] || checkTTTWin()) return;
    tttBoard[i] = tttTurn;
    tttTurn = tttTurn === 'X' ? 'O' : 'X';
    renderTicTacToe();
    const winner = checkTTTWin();
    if (winner) { document.getElementById('tttMessage').textContent = winner === 'draw' ? 'Ничья!' : `Победил ${winner}!`; }
  }
  function checkTTTWin() {
    const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for (let line of lines) { if (tttBoard[line[0]] && tttBoard[line[0]] === tttBoard[line[1]] && tttBoard[line[0]] === tttBoard[line[2]]) return tttBoard[line[0]]; }
    if (tttBoard.every(cell => cell)) return 'draw';
    return null;
  }
  function resetTicTacToe() { tttBoard = ['', '', '', '', '', '', '', '', '']; tttTurn = 'X'; document.getElementById('tttMessage').textContent = ''; renderTicTacToe(); }
</script>
</body>
</html>
